# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ros2-counter"
BBFILE_PATTERN_ros2-counter = "^${LAYERDIR}/"
BBFILE_PRIORITY_ros2-counter = "13"

LAYERDEPENDS_ros2-counter = "core ros2-jazzy-layer"
LAYERSERIES_COMPAT_ros2-counter = "scarthgap"
